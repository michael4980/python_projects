# Blueprint для Render.com: New → Blueprint → этот репозиторий (используется bunker_game/render.yaml).
services:
  - type: web
    name: bunker
    runtime: docker
    rootDir: bunker_game
    plan: free
    envVars:
      - key: MASTER_CODE
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
