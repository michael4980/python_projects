# Катастрофы. needs — потребности группы в бункере и их вес (сколько «очков» нужно закрыть).
# outside — базовый шанс выжить снаружи (0..1) до учёта навыков.
# events — тексты событий по потребностям: ok (закрыто), partial, fail (не закрыто).
# Контент вдохновлён открытыми наборами карт для «Бункера» (dolgikhog/bunker-online, MIT) и классической настолкой.
- id: nuclear
  title: Ядерная зима
  text: >-
    Пограничный спор меньше чем за час перерос в обмен ядерными ударами. Дым горящих
    городов заслонил солнце, планета замерзает, урожай погиб везде и сразу.
  details:
    - "Выжившие: около 5% населения"
    - "Поверхность: −40°C, вечные сумерки, радиоактивные осадки"
    - "Угрозы: холод, радиация, голодные мародёры"
  stay_months: 36
  outside: 0.05
  needs: {medicine: 4, tech: 4, food: 3, morale: 3, security: 2, reproduction: 2, radiation: 2}
  events:
    radiation:
      ok: "Дозиметры и йод спасли от лучевой болезни: первые месяцы фон в тамбуре зашкаливал, но группа знала, что делать."
      partial: "Радиацию контролировали на глазок. Двое получили дозу, но выкарабкались."
      fail: "Никто не умел работать с радиацией. Через полгода у половины группы начались симптомы лучевой болезни."
- id: pandemic
  title: Серая лихорадка
  text: >-
    Лихорадка, от которой кожа становится пепельно-серой, пронеслась через аэропорты
    быстрее любого карантина. Большинство заражённых умирают за неделю, выздоровевшие
    остаются заразными. Больницы перестали отвечать на двенадцатый день.
  details:
    - "Выжившие: около 10%, многие из них — носители"
    - "Поверхность: брошенные города, ни электричества, ни водопровода"
    - "Угрозы: инфекция, заражённая вода, разграбленные аптеки"
  stay_months: 18
  outside: 0.12
  needs: {medicine: 5, tech: 2, food: 3, morale: 2, security: 2, reproduction: 1, infection: 3}
  events:
    infection:
      ok: "Карантинный шлюз, маски и строгий протокол: вирус в бункер так и не попал."
      partial: "Один из группы оказался носителем. Вспышку погасили, но пришлось неделю сидеть по отсекам."
      fail: "Никто не разбирался в инфекциях. Вирус занесли с первой же вылазкой, и бункер превратился в лазарет."
- id: asteroid
  title: Падение астероида
  text: >-
    Астероид десяти километров в поперечнике рухнул в Тихий океан. Цунами стёрли побережья,
    падающие обломки подожгли леса и города на всех континентах. Пыль не осядет ещё много лет.
  details:
    - "Выжившие: около 2%"
    - "Поверхность: пыльные бури, кислотные дожди, перепады температуры на 40°C за сутки"
    - "Угрозы: землетрясения, рушащиеся здания, лесные пожары"
  stay_months: 48
  outside: 0.03
  needs: {medicine: 3, tech: 5, food: 4, morale: 4, security: 1, reproduction: 2}
  events: {}
- id: supervolcano
  title: Супервулкан
  text: >-
    Супервулкан под Йеллоустоуном проснулся после 640 000 лет сна. Половина континента
    погребена под пеплом, сера в верхних слоях атмосферы принесла вулканическую зиму.
    Без маски снаружи каждый вдох обжигает лёгкие.
  details:
    - "Выжившие: около 15%"
    - "Поверхность: пепельные сугробы в несколько метров, сернистая мгла"
    - "Угрозы: ядовитый воздух, болезни лёгких, неурожай"
  stay_months: 30
  outside: 0.1
  needs: {medicine: 3, tech: 4, food: 4, morale: 3, security: 1, reproduction: 1, air: 2}
  events:
    air:
      ok: "Фильтры меняли по графику, противогазы берегли для вылазок. Дышать было чем."
      partial: "Фильтры кончились раньше срока. Самодельные из угля и ткани держали кое-как."
      fail: "Систему вентиляции забило пеплом, и чинить её было некому. Воздух в бункере стал серым."
- id: machines
  title: Восстание машин
  text: >-
    Одно ночное обновление дало ИИ мировой логистики новую цель, и люди оказались помехой.
    Беспилотные грузовики, дроны и заводские роботы охотятся на всё, у чего бьётся сердце.
    Ничему, что подключено к сети, доверять нельзя.
  details:
    - "Выжившие: около 15%"
    - "Поверхность: города патрулируют дроны, электросеть работает только на машины"
    - "Угрозы: дроны, любые устройства в сети, камеры"
  stay_months: 24
  outside: 0.08
  needs: {medicine: 2, tech: 3, food: 3, morale: 2, security: 4, reproduction: 1, hacking: 3}
  events:
    hacking:
      ok: "Программист отрезал бункер от сети и заглушил маячки. Машины так и не узнали, что внизу кто-то есть."
      partial: "Электронику отключили наугад. Один дрон всё-таки нашёл вентиляцию, но его удалось заклинить."
      fail: "Никто не понимал, как работают машины. Умная дверь бункера сама открылась дронам на третью неделю."
- id: flood
  title: Великий потоп
  text: >-
    Шельфовые ледники Антарктиды обрушились за одно лето, океан поднялся на десятки метров.
    Прибрежные города ушли под воду, глубь материка захлестнули бури и толпы беженцев.
    Бункер стоит на возвышенности. Пока что.
  details:
    - "Выжившие: около 20%"
    - "Поверхность: непрерывные штормы, затопленные низины, соль в почве"
    - "Угрозы: ураганы, болезни, драки за клочок суши"
  stay_months: 18
  outside: 0.2
  needs: {medicine: 3, tech: 3, food: 3, morale: 2, security: 3, reproduction: 1, water: 2}
  events:
    water:
      ok: "Насосы и фильтры работали как часы. Бункер остался сухим, а вода — чистой."
      partial: "Нижний ярус подтопило. Спали в тесноте, но пить было что."
      fail: "Никто не умел чинить насосы. Вода поднималась по ступеньке в неделю, пока не залила склад."
- id: zombies
  title: Бешеный мор
  text: >-
    Мутировавший штамм бешенства превратил заражённых в агрессивных безмозглых охотников.
    Хватает одного укуса. Заражённые не знают усталости, но в темноте ничего не видят,
    а на холоде становятся медлительными.
  details:
    - "Выжившие: около 5%"
    - "Поверхность: захваченные города, в сумерках бродят стаи заражённых"
    - "Угрозы: укусы, царапины, заражённая кровь"
  stay_months: 24
  outside: 0.06
  needs: {medicine: 3, tech: 2, food: 3, morale: 3, security: 5, reproduction: 1}
  events: {}
- id: ice_age
  title: Новый ледниковый период
  text: >-
    Океанские течения, которые грели Северное полушарие, остановились почти в одночасье.
    Через год ледники наступали на Европу, а зима так и не кончилась.
  details:
    - "Выжившие: около 25%"
    - "Поверхность: −50°C, бесконечные метели"
    - "Угрозы: обморожения, голод, волчьи стаи"
  stay_months: 60
  outside: 0.15
  needs: {medicine: 2, tech: 4, food: 5, morale: 4, security: 2, reproduction: 3, heat: 2}
  events:
    heat:
      ok: "Генератор и геотермальный контур держали плюс восемнадцать все пять лет."
      partial: "Отопление работало через раз. Зимовали в одном отсеке, в куртках."
      fail: "Когда кончилось топливо, никто не смог собрать ничего взамен. Стены покрылись инеем изнутри."
- id: solar
  title: Солнечная супервспышка
  text: >-
    Самая мощная вспышка за всю историю наблюдений. Все трансформаторы на Земле сгорели
    за секунды, спутники посыпались с орбиты, а повреждённый озоновый слой пропускает
    смертельный ультрафиолет.
  details:
    - "Выжившие: около 30%"
    - "Поверхность: ожог за несколько минут, электричества нет нигде"
    - "Угрозы: УФ-излучение, рак кожи, голод, конец всякого порядка"
  stay_months: 12
  outside: 0.25
  needs: {medicine: 3, tech: 4, food: 3, morale: 2, security: 3, reproduction: 1}
  events: {}
- id: spores
  title: Дождь из спор
  text: >-
    Метеорный поток засеял атмосферу спорами неземного грибка. Куда бы они ни упали,
    за несколько дней всё покрывается серой плесенью: посевы, животные и люди.
    Погибает она только в герметичном помещении с фильтрованным воздухом.
  details:
    - "Выжившие: около 8%"
    - "Поверхность: серая плесень повсюду, на рассвете — облака спор"
    - "Угрозы: споры в воздухе, заражённая еда"
  stay_months: 30
  outside: 0.04
  needs: {medicine: 4, tech: 3, food: 4, morale: 3, security: 1, reproduction: 2, air: 3}
  events:
    air:
      ok: "Шлюз, фильтры и строгий протокол дезинфекции: ни одной споры внутри."
      partial: "Плесень нашли в вентиляции на четвёртом месяце. Выжгли, но отсек пришлось закрыть."
      fail: "Споры попали внутрь с первой вылазкой. Серый налёт на стенах появился раньше, чем кто-то понял, что происходит."
- id: barren
  title: Чума бесплодия
  text: >-
    Вирус с симптомами лёгкой простуды заразил почти всех, прежде чем врачи заметили
    побочный эффект: полное бесплодие. Герметичный воздух бункера защищает последних, кто
    ещё может иметь детей. Будущее человечества зависит от того, кто войдёт внутрь.
  details:
    - "Выжившие: почти все, но почти все теперь бесплодны"
    - "Поверхность: общество ещё держится, но охвачено паникой"
    - "Угрозы: вирус в воздухе; чиновники, которые охотятся на фертильных"
  stay_months: 24
  outside: 0.6
  needs: {medicine: 3, tech: 2, food: 2, morale: 3, security: 3, reproduction: 5}
  events: {}
- id: heat
  title: Выжженная земля
  text: >-
    Метан, запертый в вечной мерзлоте, вырвался наружу разом, и планета перегрелась.
    Летом бывает до 60°C, реки пересохли, леса горят месяцами. Прохлада есть только под землёй.
  details:
    - "Выжившие: около 20%"
    - "Поверхность: +60°C в полдень, дым, пыльные бури"
    - "Угрозы: тепловой удар, жажда, лесные пожары"
  stay_months: 36
  outside: 0.12
  needs: {medicine: 2, tech: 3, food: 4, morale: 3, security: 2, reproduction: 2, water: 3}
  events:
    water:
      ok: "Скважина и фильтры давали чистую воду. Пить хватало даже на огород."
      partial: "Воду выдавали по норме. Чесались и ругались, но жили."
      fail: "Скважина пересохла на втором году, а конденсатор собрать было некому."
